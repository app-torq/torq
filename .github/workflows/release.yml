name: release

# Attaches the API contract of the released version to every release, so app
# builds can pin the exact openapi.yaml of a server version (docs/api.md).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  attach-openapi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Upload openapi.yaml
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" openapi.yaml --clobber

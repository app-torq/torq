  /repairs:
    get:
      operationId: listRepairs
      summary: Self-repair projects
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Page size, 1–200 (default 50).
          schema:
            type: integer
        - name: offset
          in: query
          description: Items to skip (default 0).
          schema:
            type: integer
        - name: vehicle_id
          in: query
          description: Only this vehicle.
          schema:
            type: integer
        - name: status
          in: query
          description: "Only these statuses; repeat for several."
          schema:
            type: array
            items:
              type: string
              enum:
                - planned
                - in_progress
                - waiting_on_parts
                - completed
          explode: true
        - name: priority
          in: query
          description: "Only these priorities: priority ids, or none for projects without one; repeat for several."
          schema:
            type: array
            items:
              type: string
          explode: true
        - name: tag
          in: query
          description: "Only projects that have all of these tags (names, any case); repeat for several. Combined with tags: in q."
          schema:
            type: array
            items:
              type: string
          explode: true
        - name: sort
          in: query
          description: "status (default: status, then most recent), priority (priority, then status, then most recent; projects without a priority last) or updated (most recent first)."
          schema:
            type: string
        - name: q
          in: query
          description: "Search text, matched in titles, symptoms, root causes, fault codes and parts. A tags: prefix (also tag:) filters by tags instead, combined with the rest by AND: `tags:brake-fluid,\"brake discs\" weak braking` finds projects with both tags whose text mentions \"weak braking\". Plain text does not match tags."
          schema:
            type: string
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepairSummary"
                  total:
                    type: integer
                    description: Number of matching items, independent of limit and offset.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      description: "Browser session. Non-GET requests also need the header X-Torq-Request: 1."
      in: cookie
      name: torq_session
    bearerAuth:
      type: http
      description: "Session token from POST /auth/login or POST /setup with \"token\": true. Exempt from the X-Torq-Request header."
      scheme: bearer
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    Error:
      description: "An error. The status code and error.code say what went wrong; see x-torq-error-codes on each operation."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Attachment:
      type: object
      required:
        - caption
        - created_at
        - id
        - mime_type
        - original_name
        - size_bytes
        - url
      properties:
        caption:
          type: string
        created_at:
          type: string
        id:
          type: integer
        mime_type:
          type: string
          description: image/jpeg, image/png, image/webp, image/heic, image/heif or application/pdf.
        original_name:
          type: string
        size_bytes:
          type: integer
        url:
          type: string
    AutofillValue:
      type: object
      required:
        - source_name
        - source_url
        - value
      properties:
        source_name:
          type:
            - string
            - "null"
        source_url:
          type:
            - string
            - "null"
        value: {}
        value_max:
          type:
            - number
            - "null"
          description: "Upper end of a range, e.g. tyre pressure at full load; absent for single values."
    CatalogCounts:
      type: object
      required:
        - kba
        - vehicles
      properties:
        kba:
          type: integer
        vehicles:
          type: integer
    CatalogDataset:
      type: object
      required:
        - attribution
        - id
        - license
        - license_id
        - license_url
        - modified
        - name
        - publisher
        - retrieved
        - uri
      properties:
        attribution:
          type: string
        commit:
          type: string
        id:
          type: string
        license:
          type: string
        license_id:
          type: string
        license_url:
          type: string
        modified:
          type: boolean
        name:
          type: string
        publisher:
          type: string
        retrieved:
          type: string
        stand:
          type: string
        uri:
          type: string
    CatalogEngine:
      type: object
      required:
        - displacement_cc
        - engine_code
        - fuel_type
        - name
        - power_kw
      properties:
        displacement_cc:
          type:
            - integer
            - "null"
        engine_code:
          type: string
        fuel_type:
          type:
            - string
            - "null"
          description: diesel, petrol, hybrid, electric, lpg, cng or other.
        name:
          type: string
        power_kw:
          type:
            - integer
            - "null"
    CatalogGeneration:
      type: object
      required:
        - body
        - name
        - year_from
        - year_to
      properties:
        body:
          type: string
          description: sedan, hatchback, estate, coupe, cabriolet, roadster, sportback, or empty.
        name:
          type: string
        year_from:
          type:
            - integer
            - "null"
        year_to:
          type:
            - integer
            - "null"
    CatalogMeta:
      type: object
      required:
        - counts
        - datasets
        - imported_at
        - source
        - update
      properties:
        counts:
          $ref: "#/components/schemas/CatalogCounts"
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/CatalogDataset"
        imported_at:
          type:
            - string
            - "null"
        source:
          type: string
          description: bundled (shipped with this release) or online (fetched by an update).
        update:
          $ref: "#/components/schemas/CatalogUpdate"
    CatalogModel:
      type: object
      required:
        - name
        - year_from
        - year_to
      properties:
        name:
          type: string
        year_from:
          type:
            - integer
            - "null"
        year_to:
          type:
            - integer
            - "null"
    CatalogName:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    CatalogUpdate:
      type: object
      required:
        - enabled
        - error
        - finished_at
        - started_at
        - state
      properties:
        enabled:
          type: boolean
        error:
          type:
            - string
            - "null"
        finished_at:
          type:
            - string
            - "null"
        started_at:
          type:
            - string
            - "null"
        state:
          type: string
          description: idle, running, succeeded, unchanged or failed.
    CostReport:
      type: object
      required:
        - by_cost_type
        - by_source
        - cost_per_km_cents
        - distance_km
        - from
        - to
        - total_cents
      properties:
        by_cost_type:
          type: object
          additionalProperties:
            type: integer
        by_source:
          type: object
          additionalProperties:
            type: integer
        by_vehicle:
          type: array
          description: Only without vehicle_id.
          items:
            type: object
            required:
              - by_cost_type
              - by_source
              - cost_per_km_cents
              - distance_km
              - total_cents
              - vehicle_id
            properties:
              by_cost_type:
                type: object
                additionalProperties:
                  type: integer
              by_source:
                type: object
                additionalProperties:
                  type: integer
              cost_per_km_cents:
                type:
                  - number
                  - "null"
              distance_km:
                type:
                  - integer
                  - "null"
              total_cents:
                type: integer
              vehicle_id:
                type: integer
        cost_per_km_cents:
          type:
            - number
            - "null"
        distance_km:
          type:
            - integer
            - "null"
        from:
          type: string
        to:
          type: string
        total_cents:
          type: integer
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
          properties:
            code:
              type: string
              description: Dotted error code, e.g. validation.failed. Clients translate it.
            fields:
              type: object
              description: Per-field validation codes.
              additionalProperties:
                type: string
            params:

        currency_code:
          type: string
        date_format:
          type: string
          description: YYYY-MM-DD, DD.MM.YYYY or MM/DD/YYYY.
        displacement_unit:
          type: string
          description: "cc, l or ci. Displacement is always sent in cm³."
        distance_unit:
          type: string
          description: "km or mi. Used for new vehicles and distances not tied to a vehicle; a vehicle's distances use its odometer_unit. Distances are always sent in km."
        number_format:
          type: string
          description: "point or comma: the decimal separator."
        power_unit:
          type: string
          description: "kw, ps or hp. Display preference only; power is always sent in kW and W."
        pressure_unit:
          type: string
          description: "bar, psi or kpa. Pressure is always sent in bar."
        time_format:
          type: string
          description: 24h or 12h.
        torque_unit:
          type: string
          description: "nm or lbft. Torque is always sent in Nm."
        volume_unit:
          type: string
          description: "l or qt (US quarts). Volumes are always sent in mL."
    FormatsInput:
      type: object

services:
  torq:
    build: .
    image: torq:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - torq-data:/data
    env_file:
      - path: .env # optional, e.g. GEMINI_API_KEY for the spec auto-fill
        required: false
    environment:
      TZ: Europe/Berlin
      # TORQ_BASE_URL: https://torq.example.com   # enables links in notifications and Secure cookies
      # TORQ_TRUSTED_PROXIES: 172.16.0.0/12        # when running behind a reverse proxy
    healthcheck:
      test: ["CMD", "/torq", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  torq-data:

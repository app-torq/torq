          description: "km or mi. Used for new vehicles and distances not tied to a vehicle; a vehicle's distances use its odometer_unit. Distances are always sent in km."
        number_format:
          type: string
          description: "point or comma: the decimal separator."
        power_unit:
          type: string
          description: "kw, ps or hp. Display preference only; power is always sent in kW and W."
        pressure_unit:

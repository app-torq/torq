name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      # Install only; `make check` runs the linter after `make build-web`
      # has produced web/dist, which web/embed.go needs to compile.
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.15.0/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0
      - run: make setup
      - run: make build-web
      - run: make check
      - run: make test
      - run: make build

  container:
    runs-on: ubuntu-latest
    needs: check-test-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch image
        run: docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION=${{ github.sha }} -t torq:ci .
      - name: Load amd64 image
        run: docker buildx build --platform linux/amd64 --build-arg VERSION=${{ github.sha }} --load -t torq:ci .
      - name: Image must stay under 30 MB
        run: |
          size=$(docker image inspect torq:ci --format '{{.Size}}')
          echo "image size: $size bytes"
          test "$size" -lt 31457280
      - name: Start with only /data mounted and wait for healthy
        run: |
          docker volume create torq-ci-data
          docker run -d --name torq-ci -p 8080:8080 -v torq-ci-data:/data torq:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' torq-ci)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy
          curl -fsS http://localhost:8080/healthz | grep '"ok"'
          docker run --rm -v torq-ci-data:/data busybox test -f /data/torq.db
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: End-to-end suite against the container
        run: |
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium
          TORQ_E2E_URL=http://127.0.0.1:8080 npm run e2e --prefix web

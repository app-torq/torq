# torq API contract (OpenAPI 3.1), the source of truth for /api/v1.
# Tests in internal/httpapi check that it lists exactly the registered routes
# with their access levels and that every tested response matches it. Change it
# together with the handlers; see docs/api.md for the compatibility rules.
openapi: "3.1.0"
info:
  title: torq API
  version: "1"
  description: |-
    The REST API of torq, a self-hosted vehicle maintenance and DIY repair tracker. It is used by the web app and the torq mobile app.

    **Authentication.** Browsers use the `torq_session` cookie and send `X-Torq-Request: 1` on every request that is not GET or HEAD. Apps and other clients sign in with `"token": true` and send the token as `Authorization: Bearer <token>`; such requests need no extra header. Tokens expire after 30 days without use and can be revoked under `/me/sessions`.

    **Errors.** Errors are JSON with a dotted code (`{"error": {"code": "validation.failed", "fields": {...}}}`), never prose. Every operation can return `auth.unauthenticated` (401), `request.malformed` (400) and `internal` (500); operations with a path ID can return `not_found` (404); cookie requests can return `csrf.missing_header` and `csrf.origin_mismatch` (403). `x-torq-error-codes` lists the codes specific to an operation. `x-torq-access` states who may call it: `public`, `member` (any signed-in user) or `admin`.

    **Compatibility.** Within `/api/v1`, changes are additive only: no operation, field or error code is removed or renamed, no new request field becomes required, and no field changes its meaning. Clients must ignore fields they don't know, and handle unknown values in fields whose description lists the possible values: such lists can grow. `info.version` is the API level; it is also returned as `api_version` by `GET /instance` and rises by one with every release that adds operations, fields or capabilities, so clients can detect features. Servers older than torq 1.1.0 have no `GET /instance` and answer 404: treat that as level 0.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
paths:
  /instance:
    get:
      operationId: instance
      summary: Server information for clients, before sign-in
      x-torq-access: public
      security: []
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
        default:
          $ref: "#/components/responses/Error"
  /setup/status:
    get:
      operationId: setupStatus
      summary: Whether first-boot setup is pending
      x-torq-access: public
      security: []
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - setup_required
                properties:
                  setup_required:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /setup:
    post:
      operationId: setup
      summary: Create the first administrator and sign in
      x-torq-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_name:
                  type: string
                  description: Name shown in the Devices list, e.g. the phone's name. Cut to 64 characters.
                display_name:
                  type: string
                locale:
                  type: string
                password:
                  type: string
                token:
                  type: boolean
                  description: Return a bearer token in the response instead of setting the session cookie.
                username:
                  type: string
              additionalProperties: false
      x-torq-error-codes:
        - setup.already_completed
        - validation.failed
        - validation.length
        - validation.password_too_short
        - validation.username_format
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: Sign in with username and password
      x-torq-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_name:
                  type: string
                  description: Name shown in the Devices list, e.g. the phone's name. Cut to 64 characters.
                password:
                  type: string
                token:
                  type: boolean
                  description: Return a bearer token in the response instead of setting the session cookie.
                username:
                  type: string
              additionalProperties: false
      x-torq-error-codes:
        - auth.invalid_credentials
        - auth.throttled
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out the current session or token
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: "Done; no body."
        default:
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: me
      summary: The signed-in user and server information
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        default:
          $ref: "#/components/responses/Error"
  /auth/password:
    post:
      operationId: changePassword
      summary: "Change your password; other sessions end"
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
              additionalProperties: false
      x-torq-error-codes:
        - auth.invalid_credentials
        - demo.accounts_locked
        - validation.failed
        - validation.password_too_long
      responses:
        "204":
          description: "Done; no body."
        default:
          $ref: "#/components/responses/Error"
  /me/preferences:
    patch:
      operationId: updatePreferences
      summary: Update your display name and formatting preferences
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currency_code:
                  type:
                    - string
                    - "null"
                currency_symbol:
                  type:
                    - string
                    - "null"
                date_format:
                  type:
                    - string
                    - "null"
                display_name:
                  type:
                    - string
                    - "null"
                locale:
                  type:
                    - string
                    - "null"
                number_format:
                  type:
                    - string
                    - "null"
                power_unit:
                  type:
                    - string
                    - "null"
              additionalProperties: false
      x-torq-error-codes:
        - validation.failed
        - validation.invalid_choice
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  /me/sessions:
    get:
      operationId: listSessions
      summary: Your signed-in browsers and apps
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-torq-error-codes:
        - demo.accounts_locked
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
                  total:
                    type: integer
                    description: Number of matching items, independent of limit and offset.
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeOtherSessions
      summary: Sign out all your other sessions
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-torq-error-codes:
        - demo.accounts_locked
      responses:
        "204":
          description: "Done; no body."
        default:
          $ref: "#/components/responses/Error"
  "/me/sessions/{id}":
    delete:
      operationId: revokeSession
      summary: Sign out one of your sessions
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      x-torq-error-codes:
        - demo.accounts_locked
        - not_found
      responses:
        "204":
          description: "Done; no body."
        default:
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      summary: List users
      x-torq-access: admin
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-torq-error-codes:
        - auth.forbidden
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      summary: Create a user
      x-torq-access: admin
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                password:
                  type: string
                role:
                  type: string
                username:
                  type: string
              additionalProperties: false
      x-torq-error-codes:
        - demo.accounts_locked
        - user.username_taken
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
  "/users/{id}":
    patch:
      operationId: updateUser
      summary: Change a user's name, role or disabled state
      x-torq-access: admin
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disabled:
                  type:
                    - boolean
                    - "null"
                display_name:
                  type:
                    - string
                    - "null"
                role:
                  type:
                    - string
                    - "null"
              additionalProperties: false
      x-torq-error-codes:
        - demo.accounts_locked
        - user.last_admin
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      summary: Delete a user
      x-torq-access: admin
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      x-torq-error-codes:
        - demo.accounts_locked
        - user.cannot_delete_self
      responses:
        "204":
          description: "Done; no body."
        default:
          $ref: "#/components/responses/Error"
  "/users/{id}/password":
    post:
      operationId: resetUserPassword
      summary: "Set a new password for a user; their sessions end"
      x-torq-access: admin
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_password:
                  type: string
              additionalProperties: false
      x-torq-error-codes:
        - demo.accounts_locked
      responses:
        "204":
          description: "Done; no body."
        default:
          $ref: "#/components/responses/Error"
  /catalog/kba:
    get:
      operationId: getCatalogKBA
      summary: Vehicle variants for a German HSN/TSN
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: hsn
          in: query
          description: HSN, 4 digits.
          schema:
            type: string
          required: true
        - name: tsn
          in: query
          description: TSN, first 3 characters.
          schema:
            type: string
          required: true
        - name: lang
          in: query
          description: "Catalog language; defaults to the user's locale."
          schema:
            type: string
            enum:
              - en
              - de
      x-torq-error-codes:
        - catalog.hsn_invalid
        - catalog.tsn_invalid
        - validation.failed
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/KbaVariant"
        default:
          $ref: "#/components/responses/Error"
  /catalog/makes:
    get:
      operationId: getCatalogMakes
      summary: Catalog makes
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Search text.
          schema:
            type: string
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogName"
        default:
          $ref: "#/components/responses/Error"
  /catalog/models:
    get:
      operationId: getCatalogModels
      summary: Catalog models of a make
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: make
          in: query
          description: Make.
          schema:
            type: string
          required: true
        - name: q
          in: query
          description: Search text.
          schema:
            type: string
        - name: lang
          in: query
          description: "Catalog language; defaults to the user's locale."
          schema:
            type: string
            enum:
              - en
              - de
      x-torq-error-codes:
        - validation.failed
        - validation.required
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogModel"
        default:
          $ref: "#/components/responses/Error"
  /catalog/generations:
    get:
      operationId: getCatalogGenerations
      summary: Catalog generations of a model
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: make
          in: query
          description: Make.
          schema:
            type: string
          required: true
        - name: model
          in: query
          description: Model.
          schema:
            type: string
          required: true
        - name: q
          in: query
          description: Search text.
          schema:
            type: string
        - name: lang
          in: query
          description: "Catalog language; defaults to the user's locale."
          schema:
            type: string
            enum:
              - en
              - de
      x-torq-error-codes:
        - validation.failed
        - validation.required
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogGeneration"
        default:
          $ref: "#/components/responses/Error"
  /catalog/engines:
    get:
      operationId: getCatalogEngines
      summary: Catalog engines of a generation
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: make
          in: query
          description: Make.
          schema:
            type: string
          required: true
        - name: model
          in: query
          description: Model.
          schema:
            type: string
          required: true
        - name: generation
          in: query
          description: Generation.
          schema:
            type: string
          required: true
        - name: q
          in: query
          description: Search text.
          schema:
            type: string
      x-torq-error-codes:
        - validation.failed
        - validation.required
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogEngine"
        default:
          $ref: "#/components/responses/Error"
  /catalog/meta:
    get:
      operationId: getCatalogMeta
      summary: Catalog datasets, attribution and update state
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogMeta"
        default:
          $ref: "#/components/responses/Error"
  /catalog/update:
    post:
      operationId: startCatalogUpdate
      summary: Start an online catalog update
      x-torq-access: admin
      security:
        - cookieAuth: []
        - bearerAuth: []
      x-torq-error-codes:
        - auth.forbidden
        - catalog.update_running
        - catalog.updates_disabled
      responses:
        "202":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - update
                properties:
                  update:
                    $ref: "#/components/schemas/CatalogUpdate"
        default:
          $ref: "#/components/responses/Error"
  /vehicles:
    get:
      operationId: listVehicles
      summary: List vehicles
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: archived
          in: query
          description: false (default), true or all.
          schema:
            type: string
            enum:
              - "false"
              - "true"
              - all
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Vehicle"
                  total:
                    type: integer
                    description: Number of matching items, independent of limit and offset.
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createVehicle
      summary: Create a vehicle
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - vehicle
                properties:
                  vehicle:
                    $ref: "#/components/schemas/Vehicle"
        default:
          $ref: "#/components/responses/Error"
  "/vehicles/{id}":
    get:
      operationId: getVehicle
      summary: Get a vehicle
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      x-torq-error-codes:
        - not_found
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - vehicle
                properties:
                  vehicle:
                    $ref: "#/components/schemas/Vehicle"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateVehicle
      summary: Update a vehicle
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      x-torq-error-codes:
        - validation.failed
        - validation.vin
        - vehicle.displacement_out_of_range
        - vehicle.fuel_type_invalid
        - vehicle.hsn_invalid
        - vehicle.odometer_use_quick_update
        - vehicle.power_out_of_range
        - vehicle.tsn_invalid
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - vehicle
                properties:
                  vehicle:
                    $ref: "#/components/schemas/Vehicle"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteVehicle
      summary: Delete a vehicle and everything recorded for it
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm_name:
                  type: string
              additionalProperties: false
      x-torq-error-codes:
        - vehicle.confirm_name_mismatch
      responses:
        "204":
          description: "Done; no body."
        default:
          $ref: "#/components/responses/Error"
  "/vehicles/{id}/archive":
    post:
      operationId: archiveVehicle
      summary: Archive a vehicle
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - vehicle
                properties:
                  vehicle:
                    $ref: "#/components/schemas/Vehicle"
        default:
          $ref: "#/components/responses/Error"
  "/vehicles/{id}/unarchive":
    post:
      operationId: unarchiveVehicle
      summary: Restore an archived vehicle
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - vehicle
                properties:
                  vehicle:
                    $ref: "#/components/schemas/Vehicle"
        default:
          $ref: "#/components/responses/Error"
  "/vehicles/{id}/odometer":
    post:
      operationId: quickUpdateOdometer
      summary: Record an odometer reading
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm_decrease:
                  type: boolean
                confirm_large_jump:
                  type: boolean
                odometer_km:
                  type:
                    - integer
                    - "null"
                reading_date:
                  type: string
              additionalProperties: false
      x-torq-error-codes:
        - odometer.decrease_requires_confirmation
        - odometer.large_jump_requires_confirmation
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - reminders
                  - vehicle
                properties:
                  reminders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reminder"
                  vehicle:
                    $ref: "#/components/schemas/Vehicle"
        default:
          $ref: "#/components/responses/Error"
  "/vehicles/{id}/odometer-readings":
    get:
      operationId: listOdometerReadings
      summary: Odometer history
      x-torq-access: member
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
        - name: from
          in: query
          description: Earliest date, YYYY-MM-DD.
          schema:
            type: string
        - name: to
          in: query
          description: Latest date, YYYY-MM-DD.
          schema:
            type: string
      responses:
        "200":
          description: Success.
          content:

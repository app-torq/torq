<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" width="100%" height="100%" fill="none">
  <!-- Icon Container -->
  <g>
    <rect width="64" height="64" rx="14" fill="#09090b"/>
    <rect x="1" y="1" width="62" height="62" rx="13" stroke="#27272a" stroke-width="2"/>
    
    <!-- Hex Nut Cradle -->
    <path 
      d="M 16 21.5 L 10 32 L 21 51 L 43 51 L 54 32 L 48 21.5" 
      stroke="#f4f4f5" 
      stroke-width="5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    
    <!-- T-Wrench -->
    <path 
      d="M 21 13 H 43 M 32 13 V 38" 
      stroke="#f59e0b" 
      stroke-width="5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>

  <!-- Geometric Wordmark: "torq" (Pure Vector Paths) -->
  <g stroke="#f4f4f5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- t -->
    <path d="M 88 18 V 40 C 88 44 90.5 46 94.5 46 H 98 M 82 26 H 96"/>
    <!-- o -->
    <rect x="108" y="26" width="20" height="20" rx="10"/>
    <!-- r -->
    <path d="M 140 46 V 33 C 140 28.5 143.5 26 148 26 H 152"/>
    <!-- q (with subtle amber torque dot/accent) -->
    <circle cx="172" cy="36" r="10"/>
    <path d="M 182 26 V 54"/>
  </g>

  <!-- Subtle Metric Accent Dot -->
  <circle cx="195" cy="46" r="2.75" fill="#f59e0b"/>
</svg>
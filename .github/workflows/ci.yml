name: ci

on:
  push:
    branches: [main]
  pull_request:

# Jobs that need more (publish, deploy) ask for it themselves.
permissions:
  contents: read

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: "1.31.1"
      # Install only; `make check` runs the linter after `make build-web`
      # has produced web/dist, which web/embed.go needs to compile.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      - run: make setup
      - run: make build-web
      - run: make check
      - run: make test
      - run: make build

  container:
    runs-on: ubuntu-latest
    needs: check-test-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build multi-arch image
        run: docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION=${{ github.sha }} -t torq:ci .
      - name: Load amd64 image
        run: docker buildx build --platform linux/amd64 --build-arg VERSION=${{ github.sha }} --load -t torq:ci .
      - name: Image must stay under 30 MB
        run: |
          size=$(docker image inspect torq:ci --format '{{.Size}}')
          echo "image size: $size bytes"
          test "$size" -lt 31457280
      - name: Start with only /data mounted and wait for healthy
        run: |
          docker volume create torq-ci-data
          docker run -d --name torq-ci -p 8080:8080 -v torq-ci-data:/data torq:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' torq-ci)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy
          curl -fsS http://localhost:8080/healthz | grep '"ok"'
          docker run --rm -v torq-ci-data:/data busybox test -f /data/torq.db
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: End-to-end suite against the container
        run: |
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium
          TORQ_E2E_URL=http://127.0.0.1:8080 npm run e2e --prefix web

  # Pushes to main: publish the image to GHCR, then roll it out on the VPS
  # (docs/deployment.md). Only runs after every check above passed.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [check-test-build, container]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No QEMU needed: the Dockerfile cross-compiles for each platform.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "ref=$repo:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "latest=$repo:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.sha }}
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.latest }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Set the repository variable DEPLOY_HOST to turn deployments on.
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config
      - name: Upload compose file
        run: scp deploy/docker-compose.yml vps:/opt/torq/docker-compose.yml
      - name: Log the VPS in to GHCR for this deploy
        # The job token expires with the job, so no lasting credential stays on the server.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh vps docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Pull, restart and wait until healthy
        run: |
          ssh vps "IMAGE='$IMAGE' bash -s" <<'SCRIPT'
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null' EXIT
          cd /opt/torq
          printf 'TORQ_IMAGE=%s\n' "$IMAGE" > .env
          docker compose pull --quiet
          docker compose up -d --remove-orphans
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q torq)")
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "torq is $status"
          test "$status" = healthy
          docker image prune -f >/dev/null
          SCRIPT
